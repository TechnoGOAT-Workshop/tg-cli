[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technogoat-tg-cli"
version = "0.1.0"
description = "A small CLI for managing AWS validation environments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TechnoGOAT" }]
dependencies = [
    "boto3>=1.34,<2",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
    "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
tg = "tg.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tg"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

